<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cracvi Rail Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0a1a3a;--panel:#12294f;--line:#24427a;--ink:#eef3ff;--dim:#9fb3dc;--acc:#2f7bff;--warn:#ffb020;--bad:#ff4d5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;font-weight:700}
header h1 span{color:var(--acc)}
.badge{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--panel);color:var(--dim)}
.badge.live{background:#0e3a2a;color:#5dffb0}
#map{flex:1;min-height:0;background:#cfd9ea}
.fab{position:absolute;right:12px;z-index:900;width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:20px;box-shadow:0 2px 8px #0006}
#fSearch{top:130px}.toast{position:absolute;left:12px;right:70px;top:140px;z-index:900;font-size:13px;color:var(--warn);background:var(--panel);border-radius:10px;padding:0 10px}.toast:not(:empty){padding:8px 10px}
nav{display:flex;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:#51607f}
nav button.on{color:var(--acc);font-weight:700;background:#eaf1ff}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:70%;overflow:auto;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.sheet h2{margin:0 0 10px;font-size:17px}
.row{padding:11px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.row small{color:var(--dim)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;margin:4px 0 10px}
label{font-size:13px;color:var(--dim)}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;margin-top:4px}
.btn.alt{background:var(--line)}
.msg{font-size:13px;color:var(--warn);margin:8px 0 0;min-height:18px}
.tr{width:26px;height:26px}
.tr svg{width:26px;height:26px;transition:transform .6s;filter:drop-shadow(0 1px 1px #000a)}
.pop b{font-size:15px}
</style>
</head>
<body>
<header><h1>Cracvi <span>Rail Radar</span></h1><div class="badge" id="status">Demo</div></header>
<div id="map"></div>
<button class="fab" id="fSearch" aria-label="Search trains">&#128269;</button>

<div class="sheet" id="sSearch"><h2>Find a train</h2>
<input id="q" placeholder="Train number or name" autocomplete="off"><div id="results"></div></div>

<div id="msg" class="toast"></div>

<nav><button class="on" data-t="radar">RailRadar</button><button data-t="trains">Trains</button></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const map=L.map('map',{zoomControl:false,minZoom:4,maxBounds:[[5,66],[38,99]],maxBoundsViscosity:1}).setView([21,79],5);
L.control.zoom({position:'bottomright'}).addTo(map);
let tiles;
function setTiles(u){
  if(tiles)map.removeLayer(tiles);
  tiles=L.tileLayer(u||'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap, MapTiler'}).addTo(map);
}
setTiles();
fetch('/.netlify/functions/config').then(r=>r.json()).then(c=>{if(c.tiles)setTiles(c.tiles)}).catch(()=>{});

let trains=[],markers={},live=false,timer=null;
const colorFor=t=>t.delay>30?'#ff4d5e':t.delay>5?'#ffb020':'#2f7bff';
const icon=t=>L.divIcon({className:'tr',iconSize:[26,26],html:`<svg viewBox="0 0 24 24" style="transform:rotate(${t.heading||0}deg)"><path d="M12 2 20 21 12 17 4 21Z" fill="${colorFor(t)}" stroke="#001" stroke-width="1.2"/></svg>`});

/* Demo data */
const demoSeed=[["12607","Lalbagh Express",12.97,77.59],["12657","Chennai Mail",12.9,78.1],["22625","Double Decker",12.95,77.9],["12027","Shatabdi",13.0,78.8],["16021","Kaveri Express",12.5,77.9],["12639","Brindavan Exp",12.7,78.5],["12671","Nilgiri Express",11.9,78.1],["16525","Island Express",11.7,78.2],["12679","Coimbatore Intercity",11.4,78.0],["12243","Chennai Shatabdi",13.0,79.3],["12007","Mysuru Shatabdi",12.4,77.5],["16089","Yercaud Express",12.2,78.9],["12695","Trivandrum Exp",13.3,79.9],["16057","Sapthagiri",13.5,79.4],["12609","Mysuru Express",12.3,77.2],["12615","Grand Trunk Exp",13.9,79.7]];
function demoInit(){trains=demoSeed.map((s,i)=>({no:s[0],name:s[1],lat:s[2],lng:s[3],demo:1,heading:(i*47)%360,speed:50+(i*7)%60,delay:[0,3,12,0,45,0,8,0][i%8]}))}
function demoStep(){trains.forEach(t=>{const r=t.heading*Math.PI/180;t.lat+=Math.cos(r)*0.004;t.lng+=Math.sin(r)*0.004;if(Math.random()<.1)t.heading=(t.heading+(Math.random()*40-20)+360)%360})}

/* Live data adapter: adjust field names here if your provider differs */
function bearing(a,b,c,d){const r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return (Math.atan2(y,x)/r+360)%360}
function normalize(json){
  let arr=Array.isArray(json)?json:(json.data||json.trains||json.results||[]);
  if(!Array.isArray(arr)&&arr&&typeof arr==='object')arr=Object.values(arr);
  return arr.map(x=>{
    const lat=parseFloat(x.current_lat??x.lat??x.latitude),lng=parseFloat(x.current_lng??x.lng??x.lon??x.longitude);
    const nl=parseFloat(x.next_lat),ng=parseFloat(x.next_lng);
    return {no:String(x.train_number??x.trainNumber??x.number??''),name:x.train_name??x.trainName??x.name??'',
      lat,lng,heading:isFinite(nl)&&isFinite(ng)?bearing(lat,lng,nl,ng):(parseFloat(x.heading)||0),
      speed:0,delay:0,cur:x.current_station_name||'',next:x.next_station_name||'',type:x.type||''};
  }).filter(t=>isFinite(t.lat)&&isFinite(t.lng)&&t.lat>5&&t.lat<38&&t.lng>66&&t.lng<99);
}
async function fetchLive(){
  const r=await fetch('/.netlify/functions/trains');
  if(r.status===401)throw new Error('rail key rejected (401)');
  if(r.status===429)throw new Error('monthly request limit reached (429)');
  if(!r.ok)throw new Error('server returned '+r.status);
  return normalize(await r.json());
}

function draw(){
  const bb=map.getBounds().pad(.2),seen={};let n=0;
  trains.forEach(t=>{
    if(n>=500||!bb.contains([t.lat,t.lng]))return;n++;
    const id=t.no||t.name;seen[id]=1;
    const pop=`<div class="pop"><b>${t.no} ${t.name}</b>${t.type?'<br>'+t.type:''}${t.cur?'<br>At '+t.cur:''}${t.next?'<br>Next: '+t.next:''}${t.demo?'<br>'+Math.round(t.speed)+' km/h · '+(t.delay>0?'Late '+Math.round(t.delay)+' min':'On time'):''}</div>`;
    if(markers[id]){markers[id].setLatLng([t.lat,t.lng]).setIcon(icon(t)).setPopupContent(pop)}
    else markers[id]=L.marker([t.lat,t.lng],{icon:icon(t)}).bindPopup(pop).addTo(map)});
  Object.keys(markers).forEach(id=>{if(!seen[id]){map.removeLayer(markers[id]);delete markers[id]}});
  $('status').textContent=(live?'Live · ':'Demo · ')+trains.length+' trains';
  $('status').className='badge'+(live?' live':'');
}
map.on('moveend',draw);
async function tick(){
  if(live){try{trains=await fetchLive();$('msg').textContent=''}catch(e){$('msg').textContent='Live data unavailable ('+e.message+'). Showing demo trains.';live=false;trains=[];clearInterval(timer);timer=setInterval(tick,3000)}}
  if(!live){if(!trains.length)demoInit();demoStep()}
  draw();
}
function start(){clearInterval(timer);tick();timer=setInterval(()=>{if(!document.hidden)tick()},live?300000:3000)}
$('status').title='Tap to refresh';$('status').onclick=()=>tick();

/* UI */
function open(id){['sSearch'].forEach(s=>$(s).classList.toggle('open',s===id))}
$('fSearch').onclick=()=>{open('sSearch');$('q').focus()};
map.on('click',()=>open(null));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  const t=b.dataset.t;open(t==='trains'?'sSearch':null);if(t==='trains'){$('q').value='';render('')}});
function render(v){
  v=v.toLowerCase();
  const list=trains.filter(t=>!v||t.no.includes(v)||t.name.toLowerCase().includes(v)).slice(0,30);
  $('results').innerHTML=list.length?list.map(t=>`<div class="row" data-id="${t.no||t.name}"><div><b>${t.no}</b> ${t.name}<br><small>${t.cur?'At '+t.cur:''}</small></div></div>`).join(''):'<p class="msg">No train matches that search.</p>';
}
$('q').oninput=e=>render(e.target.value);
$('results').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const t=trains.find(x=>(x.no||x.name)===r.dataset.id);if(t){open(null);map.setView([t.lat,t.lng],11);setTimeout(()=>{const m=markers[r.dataset.id];if(m)m.openPopup()},400)}};
live=true;
start();
</script>
</body>
</html>
